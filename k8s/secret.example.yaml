# ตัวอย่าง Secret เท่านั้น  ค่าข้างล่างเป็นค่าสมมติ ห้ามใช้จริง
# ห้ามใส่รหัสผ่านจริงในไฟล์นี้ และห้าม apply ไฟล์นี้ทับ Secret จริง
#
# วิธีสร้าง Secret จริงโดยไม่เก็บค่าลับใน repository (PowerShell):
#   $p = Read-Host "DB password" -AsSecureString
#   $plain = [Runtime.InteropServices.Marshal]::PtrToStringAuto([Runtime.InteropServices.Marshal]::SecureStringToBSTR($p))
#   kubectl create secret generic equiploan-db-secret -n equiploan `
#     --from-literal=DB_USER=equiploan --from-literal=DB_PASSWORD=$plain
#   Remove-Variable p, plain
#
# ถ้าจำเป็นต้องใช้ไฟล์ ให้ copy เป็น k8s/secret.yaml (ถูกกันใน .gitignore แล้ว) แล้วแก้ค่า
apiVersion: v1
kind: Secret
metadata:
  name: equiploan-db-secret
  namespace: equiploan
type: Opaque
stringData:
  DB_USER: equiploan
  DB_PASSWORD: change-me
